<link rel="stylesheet" href="../styles.css">
<div style="background:#f3f5f5;padding:20px;display:flex;gap:20px;font-family:var(--font-sans);font-size:11px;color:var(--text-secondary)">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;background:#fff;border:1px solid var(--border);border-radius:4px"></div>radius sm 4</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;background:#fff;border:1px solid var(--border);border-radius:8px"></div>radius md 8</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-raised)"></div>raised</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-overlay)"></div>overlay</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-modal)"></div>modal</div>

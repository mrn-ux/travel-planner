<!-- @dsCard group="Brand" viewport="700x150" name="Iconography" subtitle="Lucide, 20px / 1.5px stroke — substituted, no icon set was attached" -->
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<div style="background:#fff;padding:20px;display:flex;gap:20px;align-items:center" id="ic"></div>
<script>
const names=['plane','train-front','bus','car','map-pin','hotel','wallet','check','calendar'];
const el=document.getElementById('ic');
names.forEach(n=>{const i=document.createElement('i');i.setAttribute('data-lucide',n);i.style.color='#566269';el.appendChild(i)});
lucide.createIcons();
setTimeout(()=>{document.querySelectorAll('#ic svg').forEach(s=>{s.setAttribute('width','20');s.setAttribute('height','20');s.setAttribute('stroke-width','1.5')})},50);
</script>

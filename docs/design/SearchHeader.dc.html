<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;justify-content:space-between;font-family:Inter,sans-serif">
<h1 style="font-family:Spectral,serif;font-weight:600;font-size:24px;margin:0;color:var(--text)">Search results</h1>
<div style="display:flex;gap:8px"><sc-for list="{{ pills }}" as="p" hint-placeholder-count="3"><span style="font-size:13px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary)">{{ p }}</span></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic { renderVals() { return { pills: ['Japan', '18–26 Nov 2026', '2 adults, 2 children'] }; } }
</script>
</body>
</html>
